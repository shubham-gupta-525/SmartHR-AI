<!DOCTYPE html>
<html>
<head>
    <title>Register Employee</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;   /* 🚀 Prevent scrolling */
        }

        .register-card {
            width: 420px;              /* Smaller card */
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* Compact Inputs */
        .register-card input,
        .register-card select,
        .register-card textarea {
            width: 100% !important;
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 3px;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .register-card input:focus,
        .register-card select:focus,
        .register-card textarea:focus {
            border-color: #4e73df;
            box-shadow: 0 0 6px rgba(78,115,223,0.3);
            outline: none;
        }

        .register-card label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .btn-register {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: none;
            background: #4e73df;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-register:hover {
            background: #2e59d9;
        }
    </style>
</head>

<body>

<div class="register-card">
    <h2>Employee Registration</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-register">
            Register Employee
        </button>
    </form>
</div>

</body>
</html>
