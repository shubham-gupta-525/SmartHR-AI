<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Attendance System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .card-header {
            background: transparent;
            border-bottom: none;
            text-align: center;
            padding-top: 30px;
        }

        .card-header h2 {
            font-weight: 600;
            color: #333;
        }

        .btn-custom {
            border-radius: 15px;
            padding: 15px;
            font-size: 18px;
            font-weight: 500;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4">
                
                <div class="card-header">
                    <h2>👤 Face Attendance System</h2>
                    <p class="text-muted">Secure • Fast • AI Powered</p>
                </div>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}


                <div class="card-body">
                    <div class="d-grid gap-3">

                        <a href="{% url 'register' %}" class="btn btn-success btn-custom">
                            ➕ Register Employee
                        </a>

                        <a href="{% url 'mark_attendance' %}" class="btn btn-primary btn-custom">
                            📸 Mark Attendance
                        </a>

                        <a href="{% url 'attendance_list' %}" class="btn btn-warning btn-custom text-dark">
                            📊 View Attendance
                        </a>

                        <a href="{% url 'view_employees' %}" class="btn btn-dark btn-custom">
                            View Employees
                        </a>


                    </div>
                </div>

                <div class="footer-text">
                    © 2026 Face Recognition Attendance System
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
