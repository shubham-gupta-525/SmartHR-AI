<!DOCTYPE html>
<html>
<head>
    <title>ID Card</title>

    <style>
        @page {
            size: 54mm 85.6mm;
            margin: 0;
        }

        html, body {
            width: 54mm;
            height: 85.6mm;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #000;
        }

        .card {
            width: 54mm;
            height: 85.6mm;
            box-sizing: border-box;
            border: 1px solid #000;
            padding: 6mm;
            page-break-after: always;
        }

        h4 {
            text-align: center;
            margin: 0 0 5mm 0;
            font-size: 12px;
            font-weight: bold;
        }

        .photo {
            width: 22mm;
            height: 22mm;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #000;
            display: block;
            margin: 0 auto 4mm auto;
        }

        .details {
            font-size: 9px;
            line-height: 1.6;
        }

        .details strong {
            display: inline-block;
            width: 18mm;
        }

        .back {
            text-align: center;
            padding-top: 15mm;
        }

        .qr {
            width: 32mm;
            height: 32mm;
            margin-bottom: 4mm;
        }

        .back p {
            font-size: 8px;
        }

        .print-btn {
            margin-top: 20px;
            padding: 8px 15px;
            border: 1px solid #000;
            background: white;
            cursor: pointer;
        }

        @media print {
            .print-btn {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- FRONT -->
<div class="card">
    <h4>EMPLOYEE ID CARD</h4>

    <img src="{{ employee.photo.url }}" class="photo">

    <div class="details">
        <strong>Name:</strong> {{ employee.name }} <br>
        <strong>ID:</strong> {{ employee.emp_id }} <br>
        <strong>Contact:</strong> {{ employee.contact }} <br>
        <strong>Email:</strong> {{ employee.email }} <br>
        <strong>Position:</strong> {{ employee.position }}
    </div>
</div>

<!-- BACK -->
<div class="card back">
    <h4>Scan for Attendance</h4>

    <img src="{{ employee.qr_code.url }}" class="qr">

    <p>Use this QR to mark Entry & Exit</p>
</div>

<button onclick="window.print()" class="print-btn">
    Download / Print ID Card
</button>

</body>
</html>
