<!DOCTYPE html>
<html>
<head>
    <title>All Employees</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .employee-card {
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .employee-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .photo-wrapper {
            height: 220px;
            background: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;   /* ✅ Show full image */
        }

        .card-body {
            background: white;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">All Employees</h2>

    <!-- 🔍 SEARCH BAR -->
    <form method="GET" class="row mb-4 justify-content-center">
        <div class="col-md-6">
            <div class="input-group shadow-sm">
                <input type="text" name="q" value="{{ query|default:'' }}" 
                    class="form-control" 
                    placeholder="Search by Name or Position">
                <button class="btn btn-primary" type="submit">
                    Search
                </button>
            </div>
        </div>
    </form>

    <div class="row">

    {% for emp in employees %}
    <div class="col-md-4 mb-4">
        <div class="card employee-card shadow-sm">

            <div class="photo-wrapper">
                <img src="{{ emp.photo.url }}">
            </div>

            <div class="card-body">
                <h5 class="card-title">{{ emp.name }}</h5>

                <p class="card-text mb-1">
                    <strong>ID:</strong> {{ emp.emp_id }}
                </p>
                <p class="card-text mb-1">
                    <strong>Contact:</strong> {{ emp.contact }}
                </p>
                <p class="card-text mb-1">
                    <strong>Email:</strong> {{ emp.email }}
                </p>
                <p class="card-text">
                    <strong>Position:</strong> {{ emp.position }}
                </p>
            </div>

        </div>
    </div>

    {% empty %}
    <div class="col-12 text-center mt-4">
        <h5>No employees found.</h5>
    </div>
    {% endfor %}

</div>

</div>

</body>
</html>
